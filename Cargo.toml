[package]
name = "tokenkeeper"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Tray app showing AI subscription usage"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"] }
pollster = "0.4"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "canvas", "x11", "wayland", "tokio"] }
png = "0.18"
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_DataExchange", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_System_Time", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Foundation_Numerics"] }
windows-numerics = "0.3"

[target.'cfg(windows)'.build-dependencies]
png = "0.18"
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
