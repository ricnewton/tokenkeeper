name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      label:
        description: Archive name label, for example a release version. Defaults to <branch>-<run number>.
        type: string
        default: ''
      release:
        description: Build from scratch without the Rust cache, so release archives never depend on cached output.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: tokenkeeper
            platform: linux
            extension: tar.gz
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: tokenkeeper.exe
            platform: win
            extension: zip
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -Dwarnings
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates libx11-6 libxkbcommon0 libwayland-client0 fonts-dejavu-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      # Caches dependencies and target/ between runs, keyed on Cargo.lock and the
      # toolchain. Only main saves the cache; pull requests restore it.
      - name: Restore Rust cache
        if: ${{ !inputs.release }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --release --locked --target "${{ matrix.target }}"

      - name: Build release
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Name archive
        env:
          LABEL: ${{ inputs.label }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$LABEL" ]; then
            LABEL="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')-$RUN_NUMBER"
          fi
          echo "ARCHIVE=tokenkeeper-${{ matrix.platform }}-$LABEL.${{ matrix.extension }}" >> "$GITHUB_ENV"

      - name: Prepare download
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          cp LICENSE README.md dist/package/
          cp docs/howto/setup.md dist/package/INSTALL.md

      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: tar -czf "dist/$ARCHIVE" -C dist/package .

      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/package/* -DestinationPath "dist/$env:ARCHIVE"

      # archive: false uploads the file as-is, so the download is the archive
      # itself rather than a zip wrapping it. The artifact takes the file name.
      - name: Upload download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 7
