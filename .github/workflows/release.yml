name: Release

# Run manually from the Actions tab after bumping the version in Cargo.toml.
# Builds and tests both platforms, then creates the v<version> tag and a
# GitHub release with tokenkeeper-win-<version>.zip and
# tokenkeeper-linux-<version>.tar.gz.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Cargo.toml version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::No package version found in Cargo.toml"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$version already exists. Bump the version in Cargo.toml first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ needs.version.outputs.version }}
      release: true

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out verification key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0

      - name: Install archive signer
        run: cargo install zipsign --version 0.2.2 --locked

      - name: Sign and verify archives
        env:
          TOKENKEEPER_UPDATE_SIGNING_KEY: ${{ secrets.TOKENKEEPER_UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/tokenkeeper-update-signing.key"
          trap 'rm -f "$key_file"' EXIT
          if [ -z "$TOKENKEEPER_UPDATE_SIGNING_KEY" ]; then
            echo "::error::TOKENKEEPER_UPDATE_SIGNING_KEY is required; see docs/howto/updates.md"
            exit 1
          fi
          printf '%s' "$TOKENKEEPER_UPDATE_SIGNING_KEY" | base64 --decode > "$key_file"
          test "$(wc -c < "$key_file")" -eq 64
          test "$(wc -c < update-public-key.bin)" -eq 32
          zipsign sign zip "dist/tokenkeeper-win-$VERSION.zip" "$key_file"
          zipsign verify zip "dist/tokenkeeper-win-$VERSION.zip" update-public-key.bin
          zipsign sign tar "dist/tokenkeeper-linux-$VERSION.tar.gz" "$key_file"
          zipsign verify tar "dist/tokenkeeper-linux-$VERSION.tar.gz" update-public-key.bin

      - name: Create draft release and attach verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist/tokenkeeper-win-$VERSION.zip" \
            "dist/tokenkeeper-linux-$VERSION.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TokenKeeper $VERSION" \
            --generate-notes \
            --draft

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
